name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  preflight:
    name: Pre-Flight Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Desktop Validation Tools
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils

      - name: Validate Version and Git Tag
        run: |
          CONFIG_VERSION=$(grep -o '"version": *"[^"]*"' app.config.json | cut -d'"' -f4)
          if [ -z "$CONFIG_VERSION" ]; then
            echo "Error: Version not found in app.config.json" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$CONFIG_VERSION" ]; then
              echo "Error: Git tag ($TAG_VERSION) does not match app.config.json ($CONFIG_VERSION)" >&2
              exit 1
            fi
          fi
          echo "Version verified: $CONFIG_VERSION"

      - name: Verify Metadata Synchronization
        run: |
          go run scripts/sync_metadata.go
          if ! git diff --quiet; then
            echo "Error: Uncommitted metadata differences detected. Run 'make sync-metadata' locally and commit the changes." >&2
            git diff
            exit 1
          fi

      - name: Validate Desktop Entry
        run: desktop-file-validate build/linux/planisphere.desktop

      - name: Run Full Test Suite
        run: make test

  build-windows:
    name: Build Windows
    needs: preflight
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Configure NSIS
        run: |
          if [ -d "/c/Program Files (x86)/NSIS" ]; then
            echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH
          elif ! command -v makensis >/dev/null 2>&1; then
            choco install nsis -y
            echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH
          fi

      - name: Package Windows Artifacts
        run: make package-windows

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-packages
          path: dist/*
          retention-days: 7

  build-linux:
    name: Build Linux
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev squashfs-tools

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Package Linux Tarball
        run: make package-tarball

      - name: Package Linux AppImage
        run: make package-appimage

      # Uncomment to publish .deb and .rpm assets directly to GitHub Releases:
      # - name: Package DEB and RPM
      #   run: make package-deb package-rpm

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-packages
          path: dist/*
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all package artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 Checksums
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f ! -name "sha256sums.txt" -exec sha256sum {} + | sed 's|  \./|  |' > sha256sums.txt
          cat sha256sums.txt

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true

  aur:
    name: Publish to AUR
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: planisphere-bin
          pkgbuild: ./packaging/arch/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
          updpkgsums: true

  close-issues:
    name: Close Resolved Issues
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Close issues marked as "unreleased"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          LABEL: "unreleased"
        run: |
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG_NAME}"
          COMMENT="This issue has been resolved in release [${TAG_NAME}](${RELEASE_URL})."

          # Fetch all open issues with the target label
          ISSUES=$(gh issue list --repo "${REPO}" --label "${LABEL}" --state open --limit 1000 --json number --jq '.[].number')

          if [ -z "$ISSUES" ]; then
            echo "No open issues found with label '${LABEL}'."
            exit 0
          fi

          for ISSUE in $ISSUES; do
            echo "Processing issue #${ISSUE}..."
            gh issue edit "${ISSUE}" --repo "${REPO}" --remove-label "${LABEL}" || true
            gh issue close "${ISSUE}" --repo "${REPO}" --comment "${COMMENT}" --reason "completed" || true
          done
