<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241407" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0806" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="edOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9D3B"/>
      <stop offset="100%" stop-color="#FF7100"/>
    </linearGradient>
    <linearGradient id="reticleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7100" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FF7100" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF7100" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGlow)" stroke="#3a2210" stroke-width="6"/>

  <!-- Cockpit HUD Outer Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#522f14" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#FF7100" stroke-width="4" stroke-opacity="0.75"/>

  <!-- Outer Ring Cardinal Notches -->
  <line x1="256" y1="64" x2="256" y2="84" stroke="#FF9D3B" stroke-width="4"/>
  <line x1="256" y1="428" x2="256" y2="448" stroke="#FF9D3B" stroke-width="4"/>
  <line x1="64" y1="256" x2="84" y2="256" stroke="#FF9D3B" stroke-width="4"/>
  <line x1="428" y1="256" x2="448" y2="256" stroke="#FF9D3B" stroke-width="4"/>

  <!-- Secondary Ticks -->
  <line x1="128" y1="128" x2="142" y2="142" stroke="#FF7100" stroke-width="2.5" stroke-opacity="0.6"/>
  <line x1="384" y1="128" x2="370" y2="142" stroke="#FF7100" stroke-width="2.5" stroke-opacity="0.6"/>
  <line x1="128" y1="384" x2="142" y2="370" stroke="#FF7100" stroke-width="2.5" stroke-opacity="0.6"/>
  <line x1="384" y1="384" x2="370" y2="370" stroke="#FF7100" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Astrometric Coordinate Grid (Planisphere Ellipses) -->
  <ellipse cx="256" cy="256" rx="140" ry="68" fill="none" stroke="#FF7100" stroke-width="2.5" stroke-opacity="0.5" transform="rotate(-25 256 256)"/>
  <ellipse cx="256" cy="256" rx="140" ry="68" fill="none" stroke="#FF7100" stroke-width="2.5" stroke-opacity="0.5" transform="rotate(35 256 256)"/>
  <ellipse cx="256" cy="256" rx="140" ry="140" fill="none" stroke="#2e1a0b" stroke-width="2"/>

  <!-- Crosshairs -->
  <line x1="140" y1="256" x2="220" y2="256" stroke="url(#reticleGrad)" stroke-width="3"/>
  <line x1="292" y1="256" x2="372" y2="256" stroke="url(#reticleGrad)" stroke-width="3"/>
  <line x1="256" y1="140" x2="256" y2="220" stroke="url(#reticleGrad)" stroke-width="3"/>
  <line x1="256" y1="292" x2="256" y2="372" stroke="url(#reticleGrad)" stroke-width="3"/>

  <!-- Inner Reticle & Compass Hub -->
  <circle cx="256" cy="256" r="48" fill="#120c08" stroke="#FF7100" stroke-width="3.5" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="32" fill="none" stroke="#FF9D3B" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Center Diamond Star / Waypoint Reticle -->
  <polygon points="256,236 276,256 256,276 236,256" fill="url(#edOrange)"/>
  <circle cx="256" cy="256" r="5" fill="#F4ECE4"/>

  <!-- Cyan Telemetry POI Blip -->
  <circle cx="330" cy="190" r="6" fill="#00D2FF" filter="url(#glow)"/>
  <circle cx="330" cy="190" r="12" fill="none" stroke="#00D2FF" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Navigation Bracket Accents (Cockpit Framing) -->
  <path d="M 60 110 L 60 60 L 110 60" fill="none" stroke="#FF7100" stroke-width="4" stroke-linecap="round"/>
  <path d="M 452 110 L 452 60 L 402 60" fill="none" stroke="#FF7100" stroke-width="4" stroke-linecap="round"/>
  <path d="M 60 402 L 60 452 L 110 452" fill="none" stroke="#FF7100" stroke-width="4" stroke-linecap="round"/>
  <path d="M 452 402 L 452 452 L 402 452" fill="none" stroke="#FF7100" stroke-width="4" stroke-linecap="round"/>
</svg>

